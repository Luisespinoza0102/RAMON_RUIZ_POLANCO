<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servidor en Mantenimiento - Error 500</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#0f172a] min-h-screen flex flex-col items-center justify-center p-6 text-center select-none">

    <div class="max-w-md bg-slate-900/40 border border-slate-800 p-8 rounded-3xl shadow-2xl backdrop-blur-sm flex flex-col items-center">
        
        <div class="mb-6 max-w-[280px] opacity-80 hover:opacity-100 transition-opacity duration-300">
            <img src="/static/img/500_server.png" alt="Servidor Caído" class="w-full h-auto object-contain rounded-2xl drop-shadow-[0_0_25px_rgba(59,130,246,0.2)]">
        </div>

        <div class="space-y-3">
            <h1 class="text-2xl font-bold text-white flex items-center justify-center gap-3">
                <i class="fas fa-exclamation-triangle text-amber-500 animate-pulse"></i> Interrupción del Sistema
            </h1>
            <p class="text-sm text-slate-400 leading-relaxed">
                Hemos detectado un inconveniente interno en el servidor. Nuestro equipo técnico ya se encuentra solventando la situación.
            </p>
        </div>

        <div class="mt-8 pt-6 border-t border-slate-800/80 w-full flex flex-col gap-4">
            <a href="/" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-bold text-sm shadow-lg shadow-blue-900/40 transition-all flex items-center justify-center gap-2 active:scale-95">
                <i class="fas fa-home"></i> Volver al Inicio
            </a>
            <p class="text-[9px] text-slate-600 uppercase tracking-widest font-bold">Código de Estado: 500 (Internal Server Error)</p>
        </div>
        
    </div>

</body>
</html>
